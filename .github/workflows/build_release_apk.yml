name: Build unsigned Omni Launcher release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build unsigned GitHub release APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease
      - name: Verify unsigned APK and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find build/outputs/apk -type f -name 'OmniLauncher.*.github.release.unsigned.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "Unsigned GitHub release APK missing"
            exit 1
          fi
          unzip -t "$apk" >/dev/null
          if "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$apk"; then
            echo "Refusing to distribute an unexpectedly signed release APK"
            exit 1
          fi
          echo "APK archive is valid and no signing certificate was detected: $apk"
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v6
        with:
          name: OmniLauncher-unsigned-release
          path: build/outputs/apk/**/*.unsigned.apk
          if-no-files-found: error
