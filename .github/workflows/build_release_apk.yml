name: Build unsigned Omni Launcher release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build unsigned GitHub release APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease
      - name: Verify APK is NOT signed
        shell: bash
        run: |
          apk=$(find build/outputs/apk -type f -name 'OmniLauncher.*.github.release.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "Unsigned GitHub release APK missing"
            exit 1
          fi
          if "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$apk"; then
            echo "Refusing to distribute an unexpectedly signed release APK"
            exit 1
          fi
          echo "Unsigned release verified: $apk"
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v6
        with:
          name: OmniLauncher-unsigned-release
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
